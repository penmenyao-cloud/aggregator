name: Process
on:
  schedule:
    - cron: "5 */6 * * *"
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-process
  cancel-in-progress: false
env:
  TZ: Asia/Shanghai
  PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
  GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"
      - name: Install
        run: pip3 install -r requirements.txt
      - name: Check
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
              echo "Error: secret 'PUSH_TOKEN' cannot be empty"
              exit 1
          fi
      - name: Process
        run: python -u subscribe/process.py -s subscribe/config.free.json --overwrite
      - name: Timestamp
        run: date
